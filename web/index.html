<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>SLOW TRAP 11 — панель + код</title>
<style>
  :root {
    --bg: #0d0f0c;
    --panel: #151814;
    --line: #262b22;
    --text: #e8e8e8;
    --dim: #7d8776;
    --accent: #b3d80d;
    --warn: #e3f07a;
  }
  * { box-sizing: border-box; }
  /* страница не скроллится вообще: CodeMirror при монтировании и eval делает
     scrollIntoView, и на обычном body это сдвигает ВСЮ страницу — панель уезжает
     за левый край, шапка за верхний. fixed на body закрывает этот вопрос. */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    position: fixed;
    inset: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex: none;
  }
  header h1 { margin: 0; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 11px; }
  .spacer { flex: 1; }
  button {
    font: inherit;
    color: var(--text);
    background: #1d211a;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 6px 14px;
    cursor: pointer;
  }
  button:hover { border-color: #3a4234; }
  button.on { background: var(--accent); border-color: var(--accent); color: #0d0f0c; font-weight: 700; }
  button.ghost { background: transparent; }
  main { flex: 1; display: grid; grid-template-columns: 380px 1fr; min-height: 0; }
  #left {
    border-right: 1px solid var(--line);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
    overflow: hidden;
  }
  #right { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  #right .bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    border-bottom: 1px solid var(--line);
    color: var(--dim);
    font-size: 11px;
  }
  #root { flex: 1; min-height: 0; overflow: hidden; }
  #root .cm-editor { height: 100%; }
  #root .cm-scroller { overflow: auto; }
  /* только нашему спектру: общий `canvas {}` покрасил бы и служебный canvas
     движка (@strudel/draw), а он во весь экран — см. комментарий в panel.js */
  #scope { width: 100%; height: 90px; display: block; background: #0a0c09; border: 1px solid var(--line); border-radius: 3px; }
  .block { border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; background: var(--panel); flex: none; }
  .block h2 {
    margin: 0 0 8px;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--dim);
    font-weight: 600;
  }
  .eq { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .band { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .band input[type=range] { writing-mode: vertical-lr; direction: rtl; width: 20px; height: 78px; accent-color: var(--accent); }
  .band .hz { font-size: 10px; color: var(--dim); }
  .band .val { font-size: 11px; color: var(--warn); }
  #knobs { overflow-y: auto; min-height: 0; flex: 1; padding-right: 4px; }
  .group { margin-bottom: 14px; }
  .group h3 {
    margin: 0 0 4px;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    position: sticky;
    top: -4px;
    background: var(--bg);
    padding: 4px 0 2px;
    z-index: 1;
  }
  .rows { display: flex; flex-direction: column; gap: 3px; }
  .cell { display: flex; flex-direction: column; gap: 3px; }
  .row { display: grid; grid-template-columns: 92px 1fr 52px; align-items: center; gap: 8px; }
  .row label { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row input[type=range] { width: 100%; accent-color: var(--accent); height: 14px; }
  .row .v { font-size: 11px; color: var(--warn); text-align: right; }
  .row.is-vol label { color: var(--text); font-weight: 600; }
  .row.is-cut input[type=range] { accent-color: #7fb0ff; }
  #status { color: var(--dim); font-size: 11px; }
  #status.err { color: #ff8a7a; }
  .hint {
    color: var(--dim);
    font-size: 11px;
    line-height: 1.5;
    margin: 0;
    flex: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .kbd { color: var(--text); }
</style>

<script type="importmap">
{
  "imports": {
    "@strudel/core": "https://esm.sh/@strudel/core@1.2.6",
    "@strudel/mini": "https://esm.sh/@strudel/mini@1.2.6",
    "@strudel/tonal": "https://esm.sh/@strudel/tonal@1.2.6",
    "@strudel/webaudio": "https://esm.sh/@strudel/webaudio@1.3.0",
    "@strudel/transpiler": "https://esm.sh/@strudel/transpiler@1.2.6",
    "@strudel/draw": "https://esm.sh/@strudel/draw@1.2.6"
  }
}
</script>
</head>
<body>
<header>
  <h1>Slow Trap 11</h1>
  <span class="sub" id="sub">136 BPM · half-time · IDM</span>
  <span class="spacer"></span>
  <span id="status">загрузка…</span>
  <button id="play" class="ghost">PLAY</button>
  <button id="stop" class="ghost">STOP</button>
</header>

<main>
  <div id="left">
    <div class="block">
      <h2>Спектр</h2>
      <canvas id="scope" width="600" height="180"></canvas>
    </div>
    <div class="block">
      <h2>Эквалайзер мастера</h2>
      <div class="eq">
        <div class="band">
          <input id="eqLow" type="range" min="-18" max="18" step="0.5" value="0" />
          <span class="val" id="eqLowV">0.0 dB</span>
          <span class="hz">низ 120</span>
        </div>
        <div class="band">
          <input id="eqMid" type="range" min="-18" max="18" step="0.5" value="0" />
          <span class="val" id="eqMidV">0.0 dB</span>
          <span class="hz">середина 900</span>
        </div>
        <div class="band">
          <input id="eqHigh" type="range" min="-18" max="18" step="0.5" value="0" />
          <span class="val" id="eqHighV">0.0 dB</span>
          <span class="hz">верх 5k</span>
        </div>
      </div>
    </div>
    <div class="block">
      <h2>Мастер</h2>
      <div class="rows">
        <div class="row">
          <label for="master">громкость</label>
          <input id="master" type="range" min="0" max="1.2" step="0.01" value="0.9" />
          <span class="v" id="masterV">0.90</span>
        </div>
      </div>
    </div>
    <div id="knobs"></div>
    <p
      class="hint"
      title="Ручки — это те же ползунки, что в коде справа: тянешь ручку, меняется число в коде и звук сразу, без перезапуска. Эквалайзер — настоящие BiquadFilter, он стоит после движка."
    >
      Ручки = ползунки в коде · EQ — после движка
    </p>
  </div>

  <div id="right">
    <div class="bar">
      <span>трек: <span class="kbd">tracks/techno/11-slowtrap-v2.js</span></span>
      <span class="spacer"></span>
      <span>Ctrl+Enter — запуск · Ctrl+. — стоп · на маке ещё Cmd+Enter</span>
    </div>
    <div id="root"></div>
  </div>
</main>

<script type="module" src="/web/panel.js"></script>
</body>
</html>
