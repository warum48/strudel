<!DOCTYPE html>
<html lang="en">
<head>

  "isAccessibleForFree": true,
  "description": "Browser studio for live-coding Strudel tracks: a mixer built from sliders, TIMELINE/AUTOMATION form, and a stable agent API (window.strudex).",
  "url": "https://strudex.runyourbiz.dpdns.org/",

<title>STRUDEL EXTENSION</title>
<style>
  :root {
    --bg: #0d0f0c;
    --panel: #151814;
    --line: #262b22;
    --text: #e8e8e8;
    --dim: #7d8776;
    --accent: #b3d80d;
    --warn: #e3f07a;
    --bad: #e06c5b;
    --mix-w: 338px;
    --tone-w: 344px;
  }
  * { box-sizing: border-box; }
  /* страница не скроллится вообще: CodeMirror при монтировании и eval делает
     scrollIntoView, и на обычном body это сдвигает ВСЮ страницу — панель уезжает
     за левый край, шапка за верхний. fixed на body закрывает этот вопрос. */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    position: fixed;
    inset: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex: none;
  }
  header h1 { margin: 0; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  header .sub { color: var(--dim); font-size: 11px; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
  /* desktop: the menu container melts into the header row; mobile turns it
     into a dropdown under the hamburger */
  #hdrMenu { display: contents; }
  #track { order: -1; }
  #newTrack { order: -1; }
  .menu-btn {
    display: none;
    align-items: center;
    justify-content: center;
    padding: 6px 10px;
    font-size: 16px;
    line-height: 1;
  }
  .spacer { flex: 1; }
  button {
    font: inherit;
    color: var(--text);
    background: #1d211a;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 6px 14px;
    cursor: pointer;
  }
  button:hover { border-color: #3a4234; }
  a.help {
    font: inherit; color: var(--text); background: #1d211a;
    border: 1px solid var(--line); border-radius: 3px;
    padding: 6px 14px; text-decoration: none; white-space: nowrap;
  }
  a.help:hover { border-color: #3a4234; }
  button.on { background: var(--accent); border-color: var(--accent); color: #0d0f0c; font-weight: 700; }
  button.ghost { background: transparent; }
  /* переключатели режимов: те же кнопки, только мелкие */
  /* свитчи — ровная сетка: подпись слева, кнопки равной ширины справа */
  .sw { display: grid; grid-template-columns: 52px minmax(0, 1fr); align-items: center; gap: 8px; }
  .sw .cap { color: var(--dim); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; margin: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sw .btns { display: flex; flex-wrap: wrap; gap: 3px; }
  .sw .btns button { flex: 0 0 auto; min-width: 72px; }
  .sw .btns button {
    height: 22px; padding: 0 6px; font-size: 10px; letter-spacing: 0.04em;
    background: transparent; border: 1px solid var(--line); border-radius: 3px;
    color: var(--dim); font-weight: 500; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .sw .btns button:hover { border-color: #3a4234; color: var(--text); }
  .sw .btns button.on {
    background: #1b2117; border-color: var(--accent); color: var(--text);
    font-weight: 600; box-shadow: inset 0 0 0 1px rgba(179, 216, 13, 0.16);
  }
  /* автоматизация под таймлайном: точки выровнены по шкале TIMELINE */
  #automation { flex: none; border-bottom: 1px solid var(--line); background: var(--panel); }
  #automation > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; padding: 7px 14px; }
  #automation > summary::-webkit-details-marker { display: none; }
  #automation > summary::before { content: '▸'; color: var(--accent); font-size: 11px; }
  #automation[open] > summary::before { content: '▾'; }
  #automation .tl-cap { color: var(--text); }
  #automation .hint { color: var(--dim); font-size: 10px; text-transform: none; letter-spacing: 0; }
  #automation[open] .hint { display: none; }
  .auto-body { padding: 2px 12px 8px; display: flex; flex-direction: column; gap: 0; max-height: 160px; overflow: auto; }
  .auto-row { position: relative; height: 22px; min-height: 22px; flex: 0 0 22px; }
  .auto-row .nm { position: absolute; left: 2px; top: 0; z-index: 2; color: var(--dim); font-size: 10px; letter-spacing: .04em; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .auto-row .nm:hover { color: var(--warn); }
  .auto-row .cur { position: absolute; right: 2px; top: 0; z-index: 2; color: var(--warn); font-size: 10px; cursor: pointer; }
  .auto-row.active .cur { color: var(--accent); }
  .auto-row .lane { position: absolute; left: 0; right: 0; bottom: 3px; z-index: 1; height: 12px; cursor: crosshair; }
  .auto-row .lane::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid #2a3024; }
  .auto-row .dot { position: absolute; top: 50%; width: 5px; height: 5px; border-radius: 50%; background: var(--dim); transform: translate(-50%, -50%); cursor: pointer; }
  .auto-row .dot::after { content: ''; position: absolute; inset: -5px; }
  .auto-row .dot:hover { background: var(--warn); }
  .auto-row.active .dot { background: var(--accent); }
  .auto-row .play { position: absolute; top: 0; bottom: 0; width: 1px; left: 0; background: var(--warn); opacity: .55; pointer-events: none; }
  /* попап правки точки AUTOMATION */
  #autoPop {
    position: fixed;
    z-index: 60;
    display: none;
    width: 196px;
    padding: 10px;
    background: #151814;
    border: 1px solid #39402f;
    border-radius: 5px;
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.66);
    color: var(--text);
    font-size: 11px;
  }
  #autoPop.open { display: block; }
  #autoPop .ttl {
    color: var(--dim);
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #autoPop .row { display: grid; grid-template-columns: 42px 1fr; align-items: center; gap: 6px; margin-bottom: 6px; }
  #autoPop label { color: var(--dim); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
  #autoPop input {
    width: 100%;
    background: #11140f;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 3px 5px;
    font: inherit;
    font-size: 11px;
  }
  #autoPop input:focus { outline: none; border-color: var(--accent); }
  #autoPop .btns { display: flex; gap: 6px; margin-top: 9px; }
  #autoPop button {
    flex: 1;
    padding: 5px 8px;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  #autoPop button.save { background: var(--accent); border-color: var(--accent); color: #0d0f0c; font-weight: 700; }
  #autoPop button.del { background: transparent; border-color: var(--bad); color: var(--bad); }
  #autoPop button.del[hidden] { display: none; }
  /* загрузка сэмплов: кнопка в шапке + компактный статус */
  @media (max-width: 1480px) {
    #samples, #sampleStatus { display: none; }
  }
  #sampleStatus {
    color: var(--warn);
    font-size: 11px;
    white-space: nowrap;
    max-width: 240px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* thin absolute sample-preload bar: fixed, so it never changes header height */
  #sampleProg {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    z-index: 10000;
    pointer-events: none;
    opacity: 0;
    transition: opacity .25s ease;
  }
  #sampleProg.on { opacity: 1; }
  #sampleProg i {
    display: block;
    width: 0;
    height: 100%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    transition: width .2s linear;
  }
  #unsaved {
    position: fixed;
    inset: 0;
    z-index: 12000;
    display: grid;
    place-items: center;
    padding: 24px;
    background: rgba(5, 7, 4, 0.74);
    -webkit-backdrop-filter: blur(9px) saturate(0.85);
  }
  #unsaved[hidden] { display: none; }
  #unsaved .u-box {
    width: min(520px, 92vw);
    background: #151814;
    border: 1px solid #2b3226;
    border-radius: 4px;
    padding: 18px 18px 14px;
    box-shadow: 0 22px 60px rgba(0, 0, 0, 0.6);
  }
  #unsaved .u-title {
    color: var(--accent);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  #unsaved .u-text {
    margin: 0 0 16px;
    color: var(--text);
    line-height: 1.45;
  }
  #unsaved .u-actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  #unsaved button { font: inherit; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding: 7px 12px; }
  #unsaved #uDiscard { border-color: var(--warn); color: var(--warn); }
  #unsaved #uCancel { border-color: var(--line); color: var(--dim); }
  #samples:disabled { opacity: 0.55; cursor: progress; }
  /* панелька переключателей — отдельным блоком между Global и микшером */
  #switches {
    flex: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    background: #11140f;
  }
  /* ── SCENES — @scenes presets (any key names) ── */
  #scenes {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-bottom: 1px solid var(--line);
    background: #11140f;
  }
  #scenes[hidden] { display: none; }
  #scenes .cap { color: var(--dim); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; width: 100%; }
  #scenes button.scene {
    flex: 1 1 auto;
    min-width: 62px;
    padding: 7px 8px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  /* ── PADS — momentary: держишь — играет, отпустил — ушло ── */
  #pads {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-bottom: 1px solid var(--line);
    background: #11140f;
  }
  #pads:empty { display: none; }
  #pads .cap { color: var(--dim); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; width: 100%; }
  #pads button.pad {
    flex: 1 1 auto;
    min-width: 62px;
    padding: 8px 6px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  #pads button.pad .k { color: var(--dim); font-weight: 400; margin-left: 5px; }
  #pads button.pad.on { background: var(--warn); border-color: var(--warn); color: #0d0f0c; font-weight: 700; }
  #pads button.pad.on .k { color: #0d0f0c; }
  /* ── MUTES — не momentary, а обычные 0/1 кнопки под сценами ── */
  #mutes {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-bottom: 1px solid var(--line);
    background: #11140f;
  }
  #mutes:empty { display: none; }
  #mutes .cap { color: var(--dim); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; width: 100%; }
  #mutes button.mute {
    flex: 1 1 auto;
    min-width: 68px;
    padding: 8px 6px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  #mutes button.mute.on { background: var(--bad); border-color: var(--bad); color: #0d0f0c; font-weight: 700; }
  /* ── TIMELINE: горизонтальная полоса секций + инспектор ── */
  #timeline { flex: none; border-bottom: 1px solid var(--line); background: #11140f; }
  #timeline > summary {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    cursor: pointer;
    color: var(--dim);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    user-select: none;
  }
  #timeline > summary::-webkit-details-marker { display: none; }
  #timeline > summary::before { content: '▸'; color: var(--accent); font-size: 11px; }
  #timeline[open] > summary::before { content: '▾'; }
  #timeline .tl-cap { color: var(--text); }
  #timeline .sp { flex: 1; }
  #timeline #tlLoop { width: 26px; height: 22px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  #timeline #tlLoop.on { background: var(--accent); border-color: var(--accent); color: #0d0f0c; font-weight: 700; }
  #timeline .tl-transport { width: 26px; height: 22px; padding: 0; font-size: 12px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
  /* две визуально объединённые группы в таймлайне: mode + транспорт */
  #timeline .tl-group { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border: 1px solid #39402f; border-radius: 7px; background: #0b0d0a; }
  #timeline .tl-group .cap { color: var(--dim); font-size: 9px; letter-spacing: 0.1em; }
  #playMode { display: inline-flex; gap: 2px; }
  #playMode button { padding: 3px 8px; font-size: 10px; letter-spacing: 0.04em; background: transparent; }
  #playMode button.on { background: var(--accent); border-color: var(--accent); color: #0d0f0c; font-weight: 700; }
  #switches:empty { display: none; }
  #timeline #play.on { background: var(--accent); border-color: var(--accent); color: #0d0f0c; }
  .sw.toggle { display: inline-flex; align-items: center; gap: 6px; }
  .sw.toggle .tgl { position: relative; display: inline-flex; width: 104px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; background: #0b0d0a; }
  .sw.toggle .tgl span { position: relative; z-index: 1; flex: 1; font-size: 9px; letter-spacing: .05em; line-height: 20px; color: var(--dim); }
  .sw.toggle .tgl span.on { color: #0d0f0c; font-weight: 700; }
  .sw.toggle .tgl i { position: absolute; z-index: 0; top: 2px; left: 2px; width: calc(50% - 2px); height: 16px; border-radius: 9px; background: var(--accent); transition: transform .18s ease; }
  .sw.toggle .tgl.on i { transform: translateX(100%); }
  .row.is-vol { grid-template-columns: 74px 1fr 42px 66px; }
  .mx-tools { display: flex; gap: 2px; justify-content: flex-start; }
  .mx-tools button { padding: 1px 4px; font-size: 9px; line-height: 1.2; min-width: 18px; }
  .mx-tools button.on.m { background: var(--bad); border-color: var(--bad); color: #0d0f0c; font-weight: 700; }
  .mx-tools button.on.s { background: var(--warn); border-color: var(--warn); color: #0d0f0c; font-weight: 700; }
  .mx-tools button.g { border-color: var(--g); color: var(--g); }
  .mx-tools button.g.on { background: var(--g); border-color: var(--g); color: #0d0f0c; font-weight: 700; }
  #timeline .tl-body { display: flex; gap: 10px; padding: 0 12px 10px; align-items: stretch; }
  #timeline .tl-track {
    flex: 1;
    min-width: 0;
    position: relative;
    height: 74px;
    border: 1px solid var(--line);
    background: #0b0d0a;
    overflow: hidden;
    cursor: pointer;
  }
  #timeline .tl-ruler { position: absolute; left: 0; right: 0; top: 0; height: 20px; border-bottom: 1px solid var(--line); }
  #timeline .tl-tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid #20251d; color: var(--dim); font-size: 9px; padding-left: 3px; }
  #timeline .tl-sections { position: absolute; left: 0; right: 0; top: 20px; bottom: 0; }
  #timeline button.tl-block {
    position: absolute;
    top: 4px;
    bottom: 4px;
    min-width: 18px;
    padding: 4px 5px;
    text-align: left;
    overflow: hidden;
    border: 1px solid #39402f;
    background: #171b14;
    color: var(--text);
    font-size: 10px;
    line-height: 1.2;
    cursor: pointer;
  }
  #timeline button.tl-block:hover { border-color: var(--warn); }
  #timeline button.tl-block.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: #1d2417; }
  #timeline button.tl-block.hold { border-color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn); background: #241d14; }
  /* LOOP: таймлайн и автоматика не работают — приглушаем и блокируем */
  #timeline.mode-locked > summary .tl-cap { opacity: 0.3; }
  #timeline.mode-locked > summary { cursor: default; }
  #automation.mode-locked > summary { opacity: 0.3; cursor: default; }
  #timeline button.tl-block .nm { display: block; font-weight: 700; letter-spacing: 0.04em; }
  #timeline button.tl-block .mt { display: block; color: var(--dim); font-size: 9px; margin-top: 2px; }
  #timeline .tl-playhead { position: absolute; top: 20px; bottom: 0; width: 2px; left: 0; background: var(--accent); box-shadow: 0 0 8px var(--accent); pointer-events: none; }
  /* section inspector intentionally hidden for now (kept for later) */
  #timeline .tl-inspector { display: none !important; }
  #timeline .tl-inspector:empty { display: none; }
  #timeline .tl-row { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
  #timeline .tl-row label { color: var(--dim); min-width: 58px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; }
  #timeline .tl-row input[type="text"], #timeline .tl-row input[type="number"], #timeline .tl-row select {
    background: #11140f; color: var(--text); border: 1px solid var(--line); padding: 2px 4px; font-size: 10px; min-width: 0;
  }
  #timeline .tl-row input[type="text"] { flex: 1; }
  #timeline .tl-row input[type="number"] { width: 62px; }
  #timeline .tl-vals { border-top: 1px solid var(--line); margin-top: 5px; padding-top: 5px; }
  #timeline .tl-val { display: grid; grid-template-columns: 1fr 64px 22px; gap: 4px; align-items: center; margin-bottom: 3px; }
  #timeline .tl-val span { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9px; }
  #timeline .tl-val input { width: 100%; }
  #timeline .tl-val button { padding: 1px 5px; font-size: 10px; }
  #timeline .tl-add { display: grid; grid-template-columns: 1fr 64px 22px; gap: 4px; margin-top: 5px; }
  #timeline .tl-empty { color: var(--dim); padding: 6px; font-size: 10px; }
  @media (max-width: 900px) {
    #timeline .tl-body { flex-direction: column; }
    #timeline .tl-inspector { width: auto; max-height: 180px; }
  }
  /* ── header tools: Sliders / Code export-import (arrow buttons) ── */
  #tools { display: flex; align-items: center; gap: 6px; }
  #tools .tcap {
    color: var(--dim);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  #tools .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }
  #tools button.tool {
    width: 24px;
    height: 24px;
    padding: 0;
    font-size: 13px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  main { flex: 1; display: grid; grid-template-columns: var(--mix-w) var(--tone-w) 1fr; min-height: 0; }
  /* два столбца сайдбара: микшер (громкости) и тонкие настройки */
  #mixer, #tone {
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
    border-right: 1px solid var(--line);
  }
  .colhead {
    flex: none;
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 8px 12px 6px;
    border-bottom: 1px solid var(--line);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }
  .colhead .n { color: var(--dim); letter-spacing: 0; text-transform: none; font-weight: 400; }
  #mixlist, #tonelist { overflow-y: auto; min-height: 0; flex: 1; padding: 8px 12px 24px; }
  /* общие ручки над микшером */
  #globals { flex: none; padding: 8px 12px; border-bottom: 1px solid var(--line); background: #11140f; }
  #globals .gl { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; }
  .rows { display: flex; flex-direction: column; gap: 2px; }
  .row { display: grid; grid-template-columns: 74px 1fr 42px; align-items: center; gap: 6px; }
  .row label { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row input[type=range] { width: 100%; accent-color: var(--accent); height: 14px; }
  .row .v { font-size: 11px; color: var(--warn); text-align: right; }
  .row.is-vol label { color: var(--text); font-weight: 600; }
  .row.is-cut input[type=range] { accent-color: #7fb0ff; }
  .act-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 1px;
    background: #20261a; border: 1px solid #35401f;
    margin-right: 5px; vertical-align: 1px;
    transition: background .12s, box-shadow .12s, border-color .12s;
  }
  .act-dot.on { background: #ff8a3d; border-color: #ff8a3d; box-shadow: 0 0 7px #ff8a3d; }
  /* ── группы и инструменты: сворачиваются оба уровня ── */
  details.grp {
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--panel);
    margin-bottom: 8px;
  }
  details.grp > summary {
    cursor: pointer;
    padding: 5px 8px;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before {
    content: '▸';
    font-size: 10px;
    color: var(--accent);
    width: 10px;
    flex: none;
    line-height: 1;
  }
  details[open] > summary::before { content: '▾'; }
  details.grp > summary .n { margin-left: auto; color: var(--dim); letter-spacing: 0; font-weight: 400; }
  details.grp > .body { padding: 0 8px 8px; }
  details.inst { border-left: 1px solid var(--line); padding-left: 6px; margin: 4px 0 2px; }
  details.inst > summary {
    cursor: pointer;
    list-style: none;
    font-size: 11px;
    color: var(--text);
    font-weight: 600;
    padding: 2px 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  details.inst > summary .n { margin-left: auto; color: var(--dim); font-weight: 400; font-size: 10px; }
  details.inst > .rows { padding: 2px 0 4px 2px; }
  /* в узком столбце подпись короче, ползунок длиннее: 172px против 110px */
  details.inst > .rows .row { grid-template-columns: 68px 1fr 38px; gap: 5px; }
  #right { min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
  /* copy-code button: sits at the right end of the editor bar */
  #copyCode {
    flex: none;
    width: 26px;
    height: 26px;
    margin-left: 4px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #1d211a;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--dim);
    cursor: pointer;
  }
  #copyCode:hover { color: var(--text); border-color: #3a4234; }
  #copyCode.copied { color: #0d0f0c; background: var(--accent); border-color: var(--accent); }
  .viz-toggle {
    display: inline-flex; align-items: center; gap: 5px;
    color: var(--dim); font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; cursor: pointer; user-select: none;
  }
  .viz-toggle input { width: 12px; height: 12px; margin: 0; accent-color: var(--accent); }
  body.viz-off .cm-inline-viz { display: none !important; }
  /* Master EQ: desktop-hidden, shown at the bottom of the mobile stack */
  #masterEq { display: none; flex: none; padding: 10px 12px; border-top: 1px solid var(--line); background: #11140f; }
  #masterEq .gl { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
  #masterEq .eq { display: flex; flex-direction: column; gap: 8px; }
  #masterEq .band { display: grid; grid-template-columns: minmax(0, 1fr) 56px 56px; align-items: center; gap: 8px; }
  #masterEq .band input[type=range] { width: 100%; accent-color: var(--accent); }
  #masterEq .band .val { color: var(--warn); font-size: 11px; text-align: right; }
  #masterEq .band .hz { color: var(--dim); font-size: 10px; text-align: right; }
  /* код красится темой редактора (activateTheme пишет --background в :root),
     панель остаётся на своих цветах — так тема видна, но лайм никуда не делся */
  #right { background: var(--background, var(--bg)); }
  /* RoomVDark: syntax colors from sublime, code panel and gutters black */
  html[data-theme="RoomVDark"] #right,
  html[data-theme="RoomVDark"] #right .bar,
  html[data-theme="RoomVDark"] #root .cm-editor,
  html[data-theme="RoomVDark"] #root .cm-scroller,
  html[data-theme="RoomVDark"] #root .cm-gutters { background: #000 !important; }
  /* darker comments in RoomVDark (sublime token class) */
  html[data-theme="RoomVDark"] .ͼf0 { color: #515864 !important; }
  /* numbers in RoomVDark: was sublime orange #fbac52 */
  html[data-theme="RoomVDark"] .ͼf6 { color: #fb7752 !important; }
  /* inline CodeMirror sliders: grey thumb, dark-grey fill, near-black empty */
  html[data-theme="RoomVDark"] .cm-slider input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    height: 8px;
    border: 1px solid #3a3a3a;
    border-radius: 4px;
    background-color: #0a0a0a;
    background-image: linear-gradient(#4a4a4a, #4a4a4a);
    background-repeat: no-repeat;
    background-size: var(--p, 0%) 100%;
  }
  html[data-theme="RoomVDark"] .cm-slider input[type="range"]::-webkit-slider-runnable-track {
    height: 8px; background: transparent;
  }
  html[data-theme="RoomVDark"] .cm-slider input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px; margin-top: -2px;
    border-radius: 50%;
    background: #8a8a8a;
    border: 1px solid #555;
  }
  html[data-theme="RoomVDark"] .cm-slider input[type="range"]::-moz-range-track {
    height: 8px; background: #0a0a0a; border: 1px solid #3a3a3a; border-radius: 4px;
  }
  html[data-theme="RoomVDark"] .cm-slider input[type="range"]::-moz-range-progress {
    height: 8px; background: #4a4a4a; border-radius: 4px;
  }
  html[data-theme="RoomVDark"] .cm-slider input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%; background: #8a8a8a; border: 1px solid #555;
  }
  #right .bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    border-bottom: 1px solid var(--line);
    color: var(--dim);
    font-size: 11px;
  }
  #root { flex: 1; min-height: 0; overflow: hidden; }
  #root .cm-editor { height: 100%; }
  #root .cm-scroller { overflow: auto; }
  /* ── спектр: фиксом в правый нижний угол, вдвое меньше прежнего ──
     pointer-events: none — иначе он ест клики по коду под собой. */
  #scope {
    position: fixed;
    right: 12px;
    bottom: 12px;
    width: 220px;
    height: 66px;
    z-index: 20;
    pointer-events: none;
    background: rgba(10, 12, 9, 0.86);
    border: 1px solid var(--line);
    border-radius: 3px;
  }
  /* Скрытый canvas, который @strudel/draw находит по id при cleanupDraw().
     Без него движок создаёт свой — position:fixed во весь экран и первым в body. */
  #test-canvas { display: none; }
  /* Визуализатор в коде: `._pianoroll()` вставляет этот canvas блоком под
     строкой — как на strudel.cc. Одна дорожка = один канвас. */
  .cm-inline-viz {
    display: block;
    margin: 4px 0 6px 4px;
    background: #0a0c09;
    border: 1px solid var(--line);
    border-radius: 3px;
  }
  /* тема редактора ставит .cm-content 18px — рядом с сотней ручек это слишком
     крупно. Возвращаем 12px; селектор с #root перебивает тему без !important. */
  #root .cm-editor .cm-content { font-size: 12px; }
  #root .cm-editor .cm-line { font-size: 12px; line-height: 1.5; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #root .cm-editor .cm-gutters { font-size: 11px; }
  select {
    font: inherit;
    font-size: 11px;
    color: var(--text);
    background: #1d211a;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 3px 4px;
  }
  /* выбор трека: любой файл из tracks/, а не один зашитый в panel.js */
  #track { max-width: 210px; }
  #status { display: none; color: var(--dim); font-size: 11px; white-space: nowrap; }
  #status.err { display: inline; color: #ff8a7a; }
  .kbd { color: var(--text); }
  /* ── mobile: single column, hamburger menu, scrollable timeline ── */
  @media (max-width: 900px) {
    header { position: relative; gap: 8px; }
    #title { flex: 1; }
    header .sub { display: none; }
    .menu-btn { display: inline-flex; }
    #hdrMenu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 50;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
      padding: 12px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.6);
    }
    header.menu-open #hdrMenu { display: flex; }
    #hdrMenu .spacer { display: none; }
    #hdrMenu #track { order: 0; max-width: none; width: 100%; }
    #hdrMenu #newTrack { order: 0; width: 100%; }
    #hdrMenu #theme { width: 100%; }
    #hdrMenu #tools { flex-wrap: wrap; }
    #hdrMenu #samples, #hdrMenu #help { width: 100%; text-align: center; }
    #hdrMenu #sampleStatus { max-width: none; white-space: normal; }

    /* timeline + automation scroll horizontally instead of shrinking */
    #timeline .tl-body { flex-direction: column; overflow-x: auto; }
    #timeline .tl-track { flex: 0 0 74px; min-width: 900px; }
    #automation .auto-body { overflow: auto; }
    .auto-row { min-width: 900px; }

    /* mixer / tone / code stacked; main is the page scroller */
    main { display: flex; flex-direction: column; overflow-y: auto; }
    #mixer, #tone { flex: none; max-height: 50vh; border-right: 0; border-bottom: 1px solid var(--line); }
    #mixlist, #tonelist { overflow-y: auto; min-height: 0; flex: 1; padding: 8px 12px 8px; }
    #right { flex: none; border-top: 1px solid var(--line); }
    #root { height: 62vh; flex: none; }
    #right .bar > span:last-of-type { display: none; }
    /* visualizer becomes a short full-width strip at the very bottom */
    #scope { position: static; right: auto; bottom: auto; z-index: auto; width: 100%; height: 26px; flex: none; border-left: 0; border-right: 0; border-radius: 0; }
  }
</style>

<script type="importmap">
{
  "imports": {
    "@strudel/core": "https://esm.sh/@strudel/core@1.2.6",
    "@strudel/mini": "https://esm.sh/@strudel/mini@1.2.6",
    "@strudel/tonal": "https://esm.sh/@strudel/tonal@1.2.6",
    "@strudel/webaudio": "https://esm.sh/@strudel/webaudio@1.3.0",
    "@strudel/transpiler": "https://esm.sh/@strudel/transpiler@1.2.6",
    "@strudel/draw": "https://esm.sh/@strudel/draw@1.2.6"
  }
}
</script>
</head>
<body>
<div id="sampleProg" aria-hidden="true"><i></i></div>
<div id="unsaved" hidden>
  <div class="u-box" role="dialog" aria-modal="true" aria-labelledby="uTitle">
    <div class="u-title" id="uTitle">Unsaved changes</div>
    <p class="u-text" id="uText"></p>
    <div class="u-actions">
      <button type="button" id="uCode">CODE JS</button>
      <button type="button" id="uDiscard">DISCARD</button>
      <button type="button" id="uCancel">CANCEL</button>
    </div>
  </div>
</div>
<header>
  <h1 id="title">…</h1>
  <span class="sub" id="sub"></span>
  <button id="menuBtn" type="button" class="menu-btn" aria-label="menu" aria-expanded="false">☰</button>
  <div id="hdrMenu">
    <select id="track" title="track (any file from tracks/)"></select>
    <button id="newTrack" type="button" class="ghost" title="load a blank starter track" aria-label="new track">+</button>
    <span class="spacer"></span>
    <span id="status">loading…</span>
    <select id="theme" title="editor color theme"></select>
    <span id="tools">
      <span class="tcap">CODE</span>
      <button id="trackExport" class="tool" type="button" title="download the Strudel code of this track">↓</button>
      <button id="trackImport" class="tool" type="button" title="load a Strudel code file">↑</button>
      <input id="trackFile" type="file" accept=".js,.txt,text/javascript" hidden />
    </span>
    <button id="samples" class="ghost" title="download and decode every sample used by this track">PRELOAD SAMPLES</button>
    <span id="sampleStatus"></span>
    <a id="help" class="help" href="/web/help.html" target="_blank" rel="noreferrer" title="how to make a track work with this UI" aria-label="help">?</a>
  </div>
</header>

<!-- ── MUTES: обычные 0/1-кнопки, не momentary; глушат группы инструментов ── -->
<div id="mutes"></div>

<!-- ── TIMELINE: горизонтальная, сворачиваемая; секции + автоматизация ── -->
<details id="timeline" open>
  <summary>
    <span class="tl-cap">Timeline</span>
    <span class="tl-group" id="playModeGroup">
      <span class="cap">mode</span>
      <span id="playMode"></span>
    </span>
    <span class="sp"></span>
    <button id="play" class="tl-transport" title="play (Ctrl+Enter)">▶</button>
    <button id="stop" class="tl-transport" title="stop">■</button>
    <button id="tlLoop" type="button" class="on" title="loop timeline / stop at the end" aria-label="loop timeline">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M17 2l4 4-4 4"></path>
        <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
        <path d="M7 22l-4-4 4-4"></path>
        <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
      </svg>
    </button>
  </summary>
  <div class="tl-body">
    <div class="tl-track" id="tlTrack" title="click to seek">
      <div class="tl-ruler" id="tlRuler" title="click a bar to seek"></div>
      <div class="tl-sections" id="tlSections"></div>
      <div class="tl-playhead" id="tlPlayhead"></div>
    </div>
    <!-- section inspector hidden for now; element kept for later edits -->
    <div class="tl-inspector" id="tlInspector"></div>
  </div>
</details>

<!-- ── AUTOMATION: изменения слайдеров во времени, под TIMELINE ── -->
<details id="automation" open>
  <summary>
    <span class="tl-cap">Automation</span>
    <span id="autoStatus">no AUTOMATION</span>
    <span class="hint">click to expand</span>
  </summary>
  <div class="auto-body" id="autolist"></div>
</details>

<main>
  <!-- ── столбец 1: ГЛОБАЛЬНОЕ → ПЕРЕКЛЮЧАТЕЛИ → МИКШЕР ── -->
  <aside id="mixer">
    <div class="colhead">Mixer <span class="n" id="mixCount"></span></div>
    <div id="globals">
      <div class="gl">Global</div>
      <div class="rows">
        <div class="row is-vol">
          <label for="out" title="output gain after the engine — not a track slider">master</label>
          <input id="out" type="range" min="0" max="1.2" step="0.01" value="0.9" />
          <span class="v" id="outV">0.90</span>
        </div>
      </div>
      <div class="rows" id="globalRows"></div>
    </div>
    <div id="switches"></div>
    <div id="scenes" hidden></div>
    <div id="pads"></div>
    <div id="mixlist"></div>
  </aside>

  <!-- ── столбец 2: ТОНКИЕ НАСТРОЙКИ. Группы и инструменты сворачиваются ── -->
  <aside id="tone">
    <div class="colhead">Tone <span class="n" id="toneCount"></span></div>
    <div id="tonelist"></div>
  </aside>

  <section id="right">
    <div class="bar">
      <span>track: <span class="kbd" id="trackPath">…</span></span>
      <span class="spacer"></span>
      <label class="viz-toggle"><input type="checkbox" id="vizToggle" checked /> visualizations</label>
      <span>Ctrl+Enter — run · Ctrl+. — stop</span>
      <button id="copyCode" type="button" class="copy-code" aria-label="copy track code" title="copy track code">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="11" height="11" rx="2"></rect>
          <path d="M5 15V5a2 2 0 0 1 2-2h10"></path>
        </svg>
      </button>
    </div>
    <canvas id="test-canvas" width="640" height="240"></canvas>
    <div id="root"></div>
  </section>

  <canvas id="scope" width="440" height="132"></canvas>

  <section id="masterEq">
    <div class="gl">Master EQ</div>
    <div class="eq">
      <div class="band">
        <input id="eqLow" type="range" min="-18" max="18" step="0.5" value="0" />
        <span class="val" id="eqLowV">0.0 dB</span>
        <span class="hz">low 120</span>
      </div>
      <div class="band">
        <input id="eqMid" type="range" min="-18" max="18" step="0.5" value="0" />
        <span class="val" id="eqMidV">0.0 dB</span>
        <span class="hz">mid 900</span>
      </div>
      <div class="band">
        <input id="eqHigh" type="range" min="-18" max="18" step="0.5" value="0" />
        <span class="val" id="eqHighV">0.0 dB</span>
        <span class="hz">high 5k</span>
      </div>
    </div>
  </section>
</main>

<script type="module" src="/web/intro.js"></script>
<script type="module" src="/web/panel.js"></script>
</body>
</html>
