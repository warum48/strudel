<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>STRUDEL EXTENSION</title>
<style>
  :root {
    --bg: #0d0f0c;
    --panel: #151814;
    --line: #262b22;
    --text: #e8e8e8;
    --dim: #7d8776;
    --accent: #b3d80d;
    --warn: #e3f07a;
    --bad: #e06c5b;
    --mix-w: 338px;
    --tone-w: 344px;
  }
  * { box-sizing: border-box; }
  /* страница не скроллится вообще: CodeMirror при монтировании и eval делает
     scrollIntoView, и на обычном body это сдвигает ВСЮ страницу — панель уезжает
     за левый край, шапка за верхний. fixed на body закрывает этот вопрос. */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    position: fixed;
    inset: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex: none;
  }
  header h1 { margin: 0; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; white-space: nowrap; }
  header .sub { color: var(--dim); font-size: 11px; white-space: nowrap; }
  .spacer { flex: 1; }
  button {
    font: inherit;
    color: var(--text);
    background: #1d211a;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 6px 14px;
    cursor: pointer;
  }
  button:hover { border-color: #3a4234; }
  a.help {
    font: inherit; color: var(--text); background: #1d211a;
    border: 1px solid var(--line); border-radius: 3px;
    padding: 6px 14px; text-decoration: none; white-space: nowrap;
  }
  a.help:hover { border-color: #3a4234; }
  button.on { background: var(--accent); border-color: var(--accent); color: #0d0f0c; font-weight: 700; }
  button.ghost { background: transparent; }
  /* переключатели режимов: те же кнопки, только мелкие */
  .sw { display: flex; align-items: center; gap: 4px; }
  .sw .cap { color: var(--dim); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; }
  .sw button { padding: 2px 7px; font-size: 11px; background: transparent; }
  .sw button.on { background: var(--accent); color: #0d0f0c; }
  /* автоматизация под таймлайном: точки выровнены по шкале TIMELINE */
  #automation { flex: none; border-bottom: 1px solid var(--line); background: var(--panel); }
  #automation > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; padding: 7px 14px; }
  #automation > summary::-webkit-details-marker { display: none; }
  #automation > summary::before { content: '▸'; color: var(--accent); font-size: 11px; }
  #automation[open] > summary::before { content: '▾'; }
  #automation .tl-cap { color: var(--text); }
  .auto-body { padding: 2px 12px 8px; display: flex; flex-direction: column; gap: 0; max-height: 160px; overflow: auto; }
  .auto-row { position: relative; height: 32px; }
  .auto-row .nm { position: absolute; left: 2px; top: 0; color: var(--dim); font-size: 10px; letter-spacing: .04em; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .auto-row .cur { position: absolute; right: 2px; top: 0; color: var(--warn); font-size: 10px; }
  .auto-row.active .cur { color: var(--accent); }
  .auto-row .lane { position: absolute; left: 0; right: 0; bottom: 5px; height: 16px; }
  .auto-row .lane::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid #2a3024; }
  .auto-row .dot { position: absolute; top: 50%; width: 6px; height: 6px; border-radius: 50%; background: var(--dim); transform: translate(-50%, -50%); cursor: help; }
  .auto-row .dot:hover { background: var(--warn); }
  .auto-row.active .dot { background: var(--accent); }
  .auto-row .play { position: absolute; top: 0; bottom: 0; width: 1px; left: 0; background: var(--warn); opacity: .55; pointer-events: none; }
  /* загрузка сэмплов: кнопка в шапке + компактный статус */
  #sampleStatus {
    color: var(--warn);
    font-size: 11px;
    white-space: nowrap;
    max-width: 240px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #samples:disabled { opacity: 0.55; cursor: progress; }
  /* панелька переключателей — отдельным блоком между Global и микшером */
  #switches {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 16px;
    padding: 7px 12px;
    border-bottom: 1px solid var(--line);
    background: #11140f;
  }
  /* ── PADS — momentary: держишь — играет, отпустил — ушло ── */
  #pads {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-bottom: 1px solid var(--line);
    background: #11140f;
  }
  #pads:empty { display: none; }
  #pads .cap { color: var(--dim); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; width: 100%; }
  #pads button.pad {
    flex: 1 1 auto;
    min-width: 62px;
    padding: 8px 6px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  #pads button.pad .k { color: var(--dim); font-weight: 400; margin-left: 5px; }
  #pads button.pad.on { background: var(--warn); border-color: var(--warn); color: #0d0f0c; font-weight: 700; }
  #pads button.pad.on .k { color: #0d0f0c; }
  /* ── MUTES — не momentary, а обычные 0/1 кнопки под сценами ── */
  #mutes {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-bottom: 1px solid var(--line);
    background: #11140f;
  }
  #mutes:empty { display: none; }
  #mutes .cap { color: var(--dim); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; width: 100%; }
  #mutes button.mute {
    flex: 1 1 auto;
    min-width: 68px;
    padding: 8px 6px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  #mutes button.mute.on { background: var(--bad); border-color: var(--bad); color: #0d0f0c; font-weight: 700; }
  /* ── TIMELINE: горизонтальная полоса секций + инспектор ── */
  #timeline { flex: none; border-bottom: 1px solid var(--line); background: #11140f; }
  #timeline > summary {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    cursor: pointer;
    color: var(--dim);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    user-select: none;
  }
  #timeline > summary::-webkit-details-marker { display: none; }
  #timeline > summary::before { content: '▸'; color: var(--accent); font-size: 11px; }
  #timeline[open] > summary::before { content: '▾'; }
  #timeline .tl-cap { color: var(--text); }
  #timeline .sp { flex: 1; }
  #timeline #tlLoop { padding: 3px 8px; font-size: 10px; }
  #timeline #tlLoop.on { background: var(--accent); border-color: var(--accent); color: #0d0f0c; font-weight: 700; }
  #timeline .tl-transport { width: 26px; height: 22px; padding: 0; font-size: 12px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
  #timeline #play.on { background: var(--accent); border-color: var(--accent); color: #0d0f0c; }
  .sw.toggle { display: inline-flex; align-items: center; gap: 6px; }
  .sw.toggle .tgl { position: relative; display: inline-flex; width: 104px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; background: #0b0d0a; }
  .sw.toggle .tgl span { position: relative; z-index: 1; flex: 1; font-size: 9px; letter-spacing: .05em; line-height: 20px; color: var(--dim); }
  .sw.toggle .tgl span.on { color: #0d0f0c; font-weight: 700; }
  .sw.toggle .tgl i { position: absolute; z-index: 0; top: 2px; left: 2px; width: calc(50% - 2px); height: 16px; border-radius: 9px; background: var(--accent); transition: transform .18s ease; }
  .sw.toggle .tgl.on i { transform: translateX(100%); }
  .row.is-vol { grid-template-columns: 74px 1fr 42px 66px; }
  .mx-tools { display: flex; gap: 2px; justify-content: flex-start; }
  .mx-tools button { padding: 1px 4px; font-size: 9px; line-height: 1.2; min-width: 18px; }
  .mx-tools button.on.m { background: var(--bad); border-color: var(--bad); color: #0d0f0c; font-weight: 700; }
  .mx-tools button.on.s { background: var(--warn); border-color: var(--warn); color: #0d0f0c; font-weight: 700; }
  .mx-tools button.g { border-color: var(--g); color: var(--g); }
  .mx-tools button.g.on { background: var(--g); border-color: var(--g); color: #0d0f0c; font-weight: 700; }
  #timeline .tl-body { display: flex; gap: 10px; padding: 0 12px 10px; align-items: stretch; }
  #timeline .tl-track {
    flex: 1;
    min-width: 0;
    position: relative;
    height: 74px;
    border: 1px solid var(--line);
    background: #0b0d0a;
    overflow: hidden;
  }
  #timeline .tl-ruler { position: absolute; left: 0; right: 0; top: 0; height: 20px; border-bottom: 1px solid var(--line); }
  #timeline .tl-tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid #20251d; color: var(--dim); font-size: 9px; padding-left: 3px; }
  #timeline .tl-sections { position: absolute; left: 0; right: 0; top: 20px; bottom: 0; }
  #timeline button.tl-block {
    position: absolute;
    top: 4px;
    bottom: 4px;
    min-width: 18px;
    padding: 4px 5px;
    text-align: left;
    overflow: hidden;
    border: 1px solid #39402f;
    background: #171b14;
    color: var(--text);
    font-size: 10px;
    line-height: 1.2;
    cursor: pointer;
  }
  #timeline button.tl-block:hover { border-color: var(--warn); }
  #timeline button.tl-block.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: #1d2417; }
  #timeline button.tl-block .nm { display: block; font-weight: 700; letter-spacing: 0.04em; }
  #timeline button.tl-block .mt { display: block; color: var(--dim); font-size: 9px; margin-top: 2px; }
  #timeline .tl-playhead { position: absolute; top: 20px; bottom: 0; width: 2px; left: 0; background: var(--accent); box-shadow: 0 0 8px var(--accent); pointer-events: none; }
  /* section inspector intentionally hidden for now (kept for later) */
  #timeline .tl-inspector { display: none !important; }
  #timeline .tl-inspector:empty { display: none; }
  #timeline .tl-row { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
  #timeline .tl-row label { color: var(--dim); min-width: 58px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; }
  #timeline .tl-row input[type="text"], #timeline .tl-row input[type="number"], #timeline .tl-row select {
    background: #11140f; color: var(--text); border: 1px solid var(--line); padding: 2px 4px; font-size: 10px; min-width: 0;
  }
  #timeline .tl-row input[type="text"] { flex: 1; }
  #timeline .tl-row input[type="number"] { width: 62px; }
  #timeline .tl-vals { border-top: 1px solid var(--line); margin-top: 5px; padding-top: 5px; }
  #timeline .tl-val { display: grid; grid-template-columns: 1fr 64px 22px; gap: 4px; align-items: center; margin-bottom: 3px; }
  #timeline .tl-val span { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9px; }
  #timeline .tl-val input { width: 100%; }
  #timeline .tl-val button { padding: 1px 5px; font-size: 10px; }
  #timeline .tl-add { display: grid; grid-template-columns: 1fr 64px 22px; gap: 4px; margin-top: 5px; }
  #timeline .tl-empty { color: var(--dim); padding: 6px; font-size: 10px; }
  @media (max-width: 900px) {
    #timeline .tl-body { flex-direction: column; }
    #timeline .tl-inspector { width: auto; max-height: 180px; }
  }
  /* ── SCENES / JSON — отдельная панелька: Intro+Theme | Export+Import ── */
  #scenes {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 14px;
    padding: 7px 12px;
    border-bottom: 1px solid var(--line);
    background: #11140f;
  }
  #scenes .zone { display: flex; align-items: center; gap: 6px; }
  #scenes .cap {
    color: var(--dim);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  #scenes .sep {
    width: 1px;
    align-self: stretch;
    background: var(--line);
    margin: 0 4px;
  }
  #scenes button {
    padding: 4px 12px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  #scenes button:disabled { opacity: 0.38; cursor: not-allowed; }
  #sceneStatus {
    margin-left: auto;
    color: var(--dim);
    font-size: 11px;
    white-space: nowrap;
    max-width: 320px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  main { flex: 1; display: grid; grid-template-columns: var(--mix-w) var(--tone-w) 1fr; min-height: 0; }
  /* два столбца сайдбара: микшер (громкости) и тонкие настройки */
  #mixer, #tone {
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
    border-right: 1px solid var(--line);
  }
  .colhead {
    flex: none;
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 8px 12px 6px;
    border-bottom: 1px solid var(--line);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }
  .colhead .n { color: var(--dim); letter-spacing: 0; text-transform: none; font-weight: 400; }
  #mixlist, #tonelist { overflow-y: auto; min-height: 0; flex: 1; padding: 8px 12px 24px; }
  /* общие ручки над микшером */
  #globals { flex: none; padding: 8px 12px; border-bottom: 1px solid var(--line); background: #11140f; }
  #globals .gl { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; }
  .rows { display: flex; flex-direction: column; gap: 2px; }
  .row { display: grid; grid-template-columns: 74px 1fr 42px; align-items: center; gap: 6px; }
  .row label { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row input[type=range] { width: 100%; accent-color: var(--accent); height: 14px; }
  .row .v { font-size: 11px; color: var(--warn); text-align: right; }
  .row.is-vol label { color: var(--text); font-weight: 600; }
  .row.is-cut input[type=range] { accent-color: #7fb0ff; }
  /* ── группы и инструменты: сворачиваются оба уровня ── */
  details.grp {
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--panel);
    margin-bottom: 8px;
  }
  details.grp > summary {
    cursor: pointer;
    padding: 5px 8px;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before {
    content: '▸';
    font-size: 10px;
    color: var(--accent);
    width: 10px;
    flex: none;
    line-height: 1;
  }
  details[open] > summary::before { content: '▾'; }
  details.grp > summary .n { margin-left: auto; color: var(--dim); letter-spacing: 0; font-weight: 400; }
  details.grp > .body { padding: 0 8px 8px; }
  details.inst { border-left: 1px solid var(--line); padding-left: 6px; margin: 4px 0 2px; }
  details.inst > summary {
    cursor: pointer;
    list-style: none;
    font-size: 11px;
    color: var(--text);
    font-weight: 600;
    padding: 2px 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  details.inst > summary .n { margin-left: auto; color: var(--dim); font-weight: 400; font-size: 10px; }
  details.inst > .rows { padding: 2px 0 4px 2px; }
  /* в узком столбце подпись короче, ползунок длиннее: 172px против 110px */
  details.inst > .rows .row { grid-template-columns: 68px 1fr 38px; gap: 5px; }
  #right { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  /* код красится темой редактора (activateTheme пишет --background в :root),
     панель остаётся на своих цветах — так тема видна, но лайм никуда не делся */
  #right { background: var(--background, var(--bg)); }
  /* RoomVDark: syntax colors from sublime, code panel and gutters black */
  html[data-theme="RoomVDark"] #right,
  html[data-theme="RoomVDark"] #right .bar,
  html[data-theme="RoomVDark"] #root .cm-editor,
  html[data-theme="RoomVDark"] #root .cm-scroller,
  html[data-theme="RoomVDark"] #root .cm-gutters { background: #000 !important; }
  /* darker comments in RoomVDark (sublime token class) */
  html[data-theme="RoomVDark"] .ͼf0 { color: #515864 !important; }
  #right .bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    border-bottom: 1px solid var(--line);
    color: var(--dim);
    font-size: 11px;
  }
  #root { flex: 1; min-height: 0; overflow: hidden; }
  #root .cm-editor { height: 100%; }
  #root .cm-scroller { overflow: auto; }
  /* ── спектр: фиксом в правый нижний угол, вдвое меньше прежнего ──
     pointer-events: none — иначе он ест клики по коду под собой. */
  #scope {
    position: fixed;
    right: 12px;
    bottom: 12px;
    width: 220px;
    height: 66px;
    z-index: 20;
    pointer-events: none;
    background: rgba(10, 12, 9, 0.86);
    border: 1px solid var(--line);
    border-radius: 3px;
  }
  /* Скрытый canvas, который @strudel/draw находит по id при cleanupDraw().
     Без него движок создаёт свой — position:fixed во весь экран и первым в body. */
  #test-canvas { display: none; }
  /* Визуализатор в коде: `._pianoroll()` вставляет этот canvas блоком под
     строкой — как на strudel.cc. Одна дорожка = один канвас. */
  .cm-inline-viz {
    display: block;
    margin: 4px 0 6px 4px;
    background: #0a0c09;
    border: 1px solid var(--line);
    border-radius: 3px;
  }
  /* тема редактора ставит .cm-content 18px — рядом с сотней ручек это слишком
     крупно. Возвращаем 13px; селектор с #root перебивает тему без !important. */
  #root .cm-editor .cm-content,
  #root .cm-editor .cm-line { font-size: 13px; line-height: 1.5; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #root .cm-editor .cm-gutters { font-size: 11px; }
  select {
    font: inherit;
    font-size: 11px;
    color: var(--text);
    background: #1d211a;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 3px 4px;
  }
  /* выбор трека: любой файл из tracks/, а не один зашитый в panel.js */
  #track { max-width: 210px; }
  #status { display: none; color: var(--dim); font-size: 11px; white-space: nowrap; }
  #status.err { display: inline; color: #ff8a7a; }
  .kbd { color: var(--text); }
</style>

<script type="importmap">
{
  "imports": {
    "@strudel/core": "https://esm.sh/@strudel/core@1.2.6",
    "@strudel/mini": "https://esm.sh/@strudel/mini@1.2.6",
    "@strudel/tonal": "https://esm.sh/@strudel/tonal@1.2.6",
    "@strudel/webaudio": "https://esm.sh/@strudel/webaudio@1.3.0",
    "@strudel/transpiler": "https://esm.sh/@strudel/transpiler@1.2.6",
    "@strudel/draw": "https://esm.sh/@strudel/draw@1.2.6"
  }
}
</script>
</head>
<body>
<header>
  <select id="track" title="track (any file from tracks/)"></select>
  <h1 id="title">…</h1>
  <span class="sub" id="sub"></span>
  <span class="spacer"></span>
  <span id="status">loading…</span>
  <select id="theme" title="editor color theme"></select>
  <button id="samples" class="ghost" title="download and decode every sample used by this track">SAMPLES</button>
  <span id="sampleStatus"></span>
  <a id="help" class="help" href="/web/help.html" title="how to make a track work with this UI">HELP</a>
</header>

<!-- ── SCENES / JSON: первая зона — пресеты, вторая — обмен JSON ── -->
<div id="scenes">
  <div class="zone">
    <span class="cap">Scenes</span>
    <button id="sceneIntro" type="button" disabled>INTRO</button>
    <button id="sceneTheme" type="button" disabled>THEME</button>
  </div>
  <span class="sep"></span>
  <div class="zone">
    <span class="cap">JSON</span>
    <button id="sceneExport" type="button" title="download the current track settings">EXPORT</button>
    <button id="sceneImport" type="button" title="load settings or scenes from JSON">IMPORT</button>
    <input id="sceneFile" type="file" accept=".json,application/json" hidden />
  </div>
  <span class="sep"></span>
  <div class="zone">
    <span class="cap">Track</span>
    <button id="trackExport" type="button" title="download the Strudel code of this track">EXPORT TRACK</button>
    <button id="trackImport" type="button" title="load a Strudel code file">IMPORT TRACK</button>
    <input id="trackFile" type="file" accept=".js,.txt,text/javascript" hidden />
  </div>
  <span id="sceneStatus"></span>
</div>

<!-- ── MUTES: обычные 0/1-кнопки, не momentary; глушат группы инструментов ── -->
<div id="mutes"></div>

<!-- ── TIMELINE: горизонтальная, сворачиваемая; секции + автоматизация ── -->
<details id="timeline" open>
  <summary>
    <span class="tl-cap">Timeline</span>
    <span class="sp"></span>
    <button id="play" class="tl-transport" title="play (Ctrl+Enter)">▶</button>
    <button id="stop" class="tl-transport" title="stop">■</button>
    <button id="tlLoop" type="button" class="on" title="loop timeline / stop at the end">LOOP</button>
  </summary>
  <div class="tl-body">
    <div class="tl-track" id="tlTrack" title="click to seek">
      <div class="tl-ruler" id="tlRuler" title="click a bar to seek"></div>
      <div class="tl-sections" id="tlSections"></div>
      <div class="tl-playhead" id="tlPlayhead"></div>
    </div>
    <!-- section inspector hidden for now; element kept for later edits -->
    <div class="tl-inspector" id="tlInspector"></div>
  </div>
</details>

<!-- ── AUTOMATION: изменения слайдеров во времени, под TIMELINE ── -->
<details id="automation" open>
  <summary>
    <span class="tl-cap">Automation</span>
    <span id="autoStatus">no AUTOMATION</span>
  </summary>
  <div class="auto-body" id="autolist"></div>
</details>

<main>
  <!-- ── столбец 1: ГЛОБАЛЬНОЕ → ПЕРЕКЛЮЧАТЕЛИ → МИКШЕР ── -->
  <aside id="mixer">
    <div class="colhead">Mixer <span class="n" id="mixCount"></span></div>
    <div id="globals">
      <div class="gl">Global</div>
      <div class="rows">
        <div class="row is-vol">
          <label for="out" title="output gain after the engine — not a track slider">master</label>
          <input id="out" type="range" min="0" max="1.2" step="0.01" value="0.9" />
          <span class="v" id="outV">0.90</span>
        </div>
      </div>
      <div class="rows" id="globalRows"></div>
    </div>
    <div id="switches"></div>
    <div id="pads"></div>
    <div id="mixlist"></div>
  </aside>

  <!-- ── столбец 2: ТОНКИЕ НАСТРОЙКИ. Группы и инструменты сворачиваются ── -->
  <aside id="tone">
    <div class="colhead">Tone <span class="n" id="toneCount"></span></div>
    <div id="tonelist"></div>
  </aside>

  <section id="right">
    <div class="bar">
      <span>track: <span class="kbd" id="trackPath">…</span></span>
      <span class="spacer"></span>
      <span>viz: <span class="kbd">._pianoroll()</span> in the code</span>
      <span>Ctrl+Enter — run · Ctrl+. — stop · Cmd also works</span>
    </div>
    <canvas id="test-canvas" width="640" height="240"></canvas>
    <div id="root"></div>
  </section>
</main>

<!-- спектр живёт фиксом в правом нижнем углу, вне потока -->
<canvas id="scope" width="440" height="132"></canvas>

<!--
  ── MASTER EQ — СКРЫТ, НЕ УДАЛЁН ────────────────────────────────────
  Ручки убраны из интерфейса по просьбе («эквалайзер (ручки) просто
  скрываем, если что — вернём»). Цепочка фильтров в panel.js осталась и
  работает на 0 dB, поэтому вернуть = раскомментировать этот блок и
  вызвать bindEq() в panel.js (там тоже закомментировано, рядом метка).

  <div class="block">
    <h2>Master EQ</h2>
    <div class="eq">
      <div class="band">
        <input id="eqLow" type="range" min="-18" max="18" step="0.5" value="0" />
        <span class="val" id="eqLowV">0.0 dB</span>
        <span class="hz">low 120</span>
      </div>
      <div class="band">
        <input id="eqMid" type="range" min="-18" max="18" step="0.5" value="0" />
        <span class="val" id="eqMidV">0.0 dB</span>
        <span class="hz">mid 900</span>
      </div>
      <div class="band">
        <input id="eqHigh" type="range" min="-18" max="18" step="0.5" value="0" />
        <span class="val" id="eqHighV">0.0 dB</span>
        <span class="hz">high 5k</span>
      </div>
    </div>
  </div>
-->

<script type="module" src="/web/panel.js"></script>
</body>
</html>
