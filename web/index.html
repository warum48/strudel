<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>STRUDEL EXTENSION</title>
<style>
  :root {
    --bg: #0d0f0c;
    --panel: #151814;
    --line: #262b22;
    --text: #e8e8e8;
    --dim: #7d8776;
    --accent: #b3d80d;
    --warn: #e3f07a;
    --mix-w: 258px;
    --tone-w: 344px;
  }
  * { box-sizing: border-box; }
  /* страница не скроллится вообще: CodeMirror при монтировании и eval делает
     scrollIntoView, и на обычном body это сдвигает ВСЮ страницу — панель уезжает
     за левый край, шапка за верхний. fixed на body закрывает этот вопрос. */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    position: fixed;
    inset: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex: none;
  }
  header h1 { margin: 0; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; white-space: nowrap; }
  header .sub { color: var(--dim); font-size: 11px; white-space: nowrap; }
  .spacer { flex: 1; }
  button {
    font: inherit;
    color: var(--text);
    background: #1d211a;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 6px 14px;
    cursor: pointer;
  }
  button:hover { border-color: #3a4234; }
  button.on { background: var(--accent); border-color: var(--accent); color: #0d0f0c; font-weight: 700; }
  button.ghost { background: transparent; }
  /* переключатели режимов: те же кнопки, только мелкие */
  .sw { display: flex; align-items: center; gap: 4px; }
  .sw .cap { color: var(--dim); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; }
  .sw button { padding: 2px 7px; font-size: 11px; background: transparent; }
  .sw button.on { background: var(--accent); color: #0d0f0c; }
  /* загрузка сэмплов: кнопка в шапке + компактный статус */
  #sampleStatus {
    color: var(--warn);
    font-size: 11px;
    white-space: nowrap;
    max-width: 240px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #samples:disabled { opacity: 0.55; cursor: progress; }
  /* панелька переключателей — отдельным блоком между Global и микшером */
  #switches {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 16px;
    padding: 7px 12px;
    border-bottom: 1px solid var(--line);
    background: #11140f;
  }
  /* ── PADS — momentary: держишь — играет, отпустил — ушло ── */
  #pads {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-bottom: 1px solid var(--line);
    background: #11140f;
  }
  #pads:empty { display: none; }
  #pads .cap { color: var(--dim); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; width: 100%; }
  #pads button.pad {
    flex: 1 1 auto;
    min-width: 62px;
    padding: 8px 6px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  #pads button.pad .k { color: var(--dim); font-weight: 400; margin-left: 5px; }
  #pads button.pad.on { background: var(--warn); border-color: var(--warn); color: #0d0f0c; font-weight: 700; }
  #pads button.pad.on .k { color: #0d0f0c; }
  /* ── SCENES / JSON — отдельная панелька: Intro+Theme | Export+Import ── */
  #scenes {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 14px;
    padding: 7px 12px;
    border-bottom: 1px solid var(--line);
    background: #11140f;
  }
  #scenes .zone { display: flex; align-items: center; gap: 6px; }
  #scenes .cap {
    color: var(--dim);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  #scenes .sep {
    width: 1px;
    align-self: stretch;
    background: var(--line);
    margin: 0 4px;
  }
  #scenes button {
    padding: 4px 12px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  #scenes button:disabled { opacity: 0.38; cursor: not-allowed; }
  #sceneStatus {
    margin-left: auto;
    color: var(--dim);
    font-size: 11px;
    white-space: nowrap;
    max-width: 320px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  main { flex: 1; display: grid; grid-template-columns: var(--mix-w) var(--tone-w) 1fr; min-height: 0; }
  /* два столбца сайдбара: микшер (громкости) и тонкие настройки */
  #mixer, #tone {
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
    border-right: 1px solid var(--line);
  }
  .colhead {
    flex: none;
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 8px 12px 6px;
    border-bottom: 1px solid var(--line);
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }
  .colhead .n { color: var(--dim); letter-spacing: 0; text-transform: none; font-weight: 400; }
  #mixlist, #tonelist { overflow-y: auto; min-height: 0; flex: 1; padding: 8px 12px 24px; }
  /* общие ручки над микшером */
  #globals { flex: none; padding: 8px 12px; border-bottom: 1px solid var(--line); background: #11140f; }
  #globals .gl { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; }
  .rows { display: flex; flex-direction: column; gap: 2px; }
  .row { display: grid; grid-template-columns: 74px 1fr 42px; align-items: center; gap: 6px; }
  .row label { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row input[type=range] { width: 100%; accent-color: var(--accent); height: 14px; }
  .row .v { font-size: 11px; color: var(--warn); text-align: right; }
  .row.is-vol label { color: var(--text); font-weight: 600; }
  .row.is-cut input[type=range] { accent-color: #7fb0ff; }
  /* ── группы и инструменты: сворачиваются оба уровня ── */
  details.grp {
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--panel);
    margin-bottom: 8px;
  }
  details.grp > summary {
    cursor: pointer;
    padding: 5px 8px;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before {
    content: '▸';
    font-size: 10px;
    color: var(--accent);
    width: 10px;
    flex: none;
    line-height: 1;
  }
  details[open] > summary::before { content: '▾'; }
  details.grp > summary .n { margin-left: auto; color: var(--dim); letter-spacing: 0; font-weight: 400; }
  details.grp > .body { padding: 0 8px 8px; }
  details.inst { border-left: 1px solid var(--line); padding-left: 6px; margin: 4px 0 2px; }
  details.inst > summary {
    cursor: pointer;
    list-style: none;
    font-size: 11px;
    color: var(--text);
    font-weight: 600;
    padding: 2px 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  details.inst > summary .n { margin-left: auto; color: var(--dim); font-weight: 400; font-size: 10px; }
  details.inst > .rows { padding: 2px 0 4px 2px; }
  /* в узком столбце подпись короче, ползунок длиннее: 172px против 110px */
  details.inst > .rows .row { grid-template-columns: 68px 1fr 38px; gap: 5px; }
  #right { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  /* код красится темой редактора (activateTheme пишет --background в :root),
     панель остаётся на своих цветах — так тема видна, но лайм никуда не делся */
  #right { background: var(--background, var(--bg)); }
  #right .bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    border-bottom: 1px solid var(--line);
    color: var(--dim);
    font-size: 11px;
  }
  #root { flex: 1; min-height: 0; overflow: hidden; }
  #root .cm-editor { height: 100%; }
  #root .cm-scroller { overflow: auto; }
  /* ── спектр: фиксом в правый нижний угол, вдвое меньше прежнего ──
     pointer-events: none — иначе он ест клики по коду под собой. */
  #scope {
    position: fixed;
    right: 12px;
    bottom: 12px;
    width: 220px;
    height: 66px;
    z-index: 20;
    pointer-events: none;
    background: rgba(10, 12, 9, 0.86);
    border: 1px solid var(--line);
    border-radius: 3px;
  }
  /* Скрытый canvas, который @strudel/draw находит по id при cleanupDraw().
     Без него движок создаёт свой — position:fixed во весь экран и первым в body. */
  #test-canvas { display: none; }
  /* Визуализатор в коде: `._pianoroll()` вставляет этот canvas блоком под
     строкой — как на strudel.cc. Одна дорожка = один канвас. */
  .cm-inline-viz {
    display: block;
    margin: 4px 0 6px 4px;
    background: #0a0c09;
    border: 1px solid var(--line);
    border-radius: 3px;
  }
  /* тема редактора ставит .cm-content 18px — рядом с сотней ручек это слишком
     крупно. Возвращаем 13px; селектор с #root перебивает тему без !important. */
  #root .cm-editor .cm-content,
  #root .cm-editor .cm-line { font-size: 13px; line-height: 1.5; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #root .cm-editor .cm-gutters { font-size: 11px; }
  select {
    font: inherit;
    font-size: 11px;
    color: var(--text);
    background: #1d211a;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 3px 4px;
  }
  /* выбор трека: любой файл из tracks/, а не один зашитый в panel.js */
  #track { max-width: 210px; }
  #status { color: var(--dim); font-size: 11px; white-space: nowrap; }
  #status.err { color: #ff8a7a; }
  .kbd { color: var(--text); }
</style>

<script type="importmap">
{
  "imports": {
    "@strudel/core": "https://esm.sh/@strudel/core@1.2.6",
    "@strudel/mini": "https://esm.sh/@strudel/mini@1.2.6",
    "@strudel/tonal": "https://esm.sh/@strudel/tonal@1.2.6",
    "@strudel/webaudio": "https://esm.sh/@strudel/webaudio@1.3.0",
    "@strudel/transpiler": "https://esm.sh/@strudel/transpiler@1.2.6",
    "@strudel/draw": "https://esm.sh/@strudel/draw@1.2.6"
  }
}
</script>
</head>
<body>
<header>
  <select id="track" title="track (any file from tracks/)"></select>
  <h1 id="title">…</h1>
  <span class="sub" id="sub"></span>
  <span class="spacer"></span>
  <span id="status">loading…</span>
  <select id="theme" title="editor color theme"></select>
  <button id="play" class="ghost">PLAY</button>
  <button id="stop" class="ghost">STOP</button>
  <button id="samples" class="ghost" title="download and decode every sample used by this track">SAMPLES</button>
  <span id="sampleStatus"></span>
</header>

<!-- ── SCENES / JSON: первая зона — пресеты, вторая — обмен JSON ── -->
<div id="scenes">
  <div class="zone">
    <span class="cap">Scenes</span>
    <button id="sceneIntro" type="button" disabled>INTRO</button>
    <button id="sceneTheme" type="button" disabled>THEME</button>
  </div>
  <span class="sep"></span>
  <div class="zone">
    <span class="cap">JSON</span>
    <button id="sceneExport" type="button" title="download the current track settings">EXPORT</button>
    <button id="sceneImport" type="button" title="load settings or scenes from JSON">IMPORT</button>
    <input id="sceneFile" type="file" accept=".json,application/json" hidden />
  </div>
  <span id="sceneStatus"></span>
</div>

<main>
  <!-- ── столбец 1: ГЛОБАЛЬНОЕ → ПЕРЕКЛЮЧАТЕЛИ → МИКШЕР ── -->
  <aside id="mixer">
    <div class="colhead">Mixer <span class="n" id="mixCount"></span></div>
    <div id="globals">
      <div class="gl">Global</div>
      <div class="rows">
        <div class="row is-vol">
          <label for="out" title="output gain after the engine — not a track slider">master</label>
          <input id="out" type="range" min="0" max="1.2" step="0.01" value="0.9" />
          <span class="v" id="outV">0.90</span>
        </div>
      </div>
      <div class="rows" id="globalRows"></div>
    </div>
    <div id="switches"></div>
    <div id="pads"></div>
    <div id="mixlist"></div>
  </aside>

  <!-- ── столбец 2: ТОНКИЕ НАСТРОЙКИ. Группы и инструменты сворачиваются ── -->
  <aside id="tone">
    <div class="colhead">Tone <span class="n" id="toneCount"></span></div>
    <div id="tonelist"></div>
  </aside>

  <section id="right">
    <div class="bar">
      <span>track: <span class="kbd" id="trackPath">…</span></span>
      <span class="spacer"></span>
      <span>viz: <span class="kbd">._pianoroll()</span> in the code</span>
      <span>Ctrl+Enter — run · Ctrl+. — stop · Cmd also works</span>
    </div>
    <canvas id="test-canvas" width="640" height="240"></canvas>
    <div id="root"></div>
  </section>
</main>

<!-- спектр живёт фиксом в правом нижнем углу, вне потока -->
<canvas id="scope" width="440" height="132"></canvas>

<!--
  ── MASTER EQ — СКРЫТ, НЕ УДАЛЁН ────────────────────────────────────
  Ручки убраны из интерфейса по просьбе («эквалайзер (ручки) просто
  скрываем, если что — вернём»). Цепочка фильтров в panel.js осталась и
  работает на 0 dB, поэтому вернуть = раскомментировать этот блок и
  вызвать bindEq() в panel.js (там тоже закомментировано, рядом метка).

  <div class="block">
    <h2>Master EQ</h2>
    <div class="eq">
      <div class="band">
        <input id="eqLow" type="range" min="-18" max="18" step="0.5" value="0" />
        <span class="val" id="eqLowV">0.0 dB</span>
        <span class="hz">low 120</span>
      </div>
      <div class="band">
        <input id="eqMid" type="range" min="-18" max="18" step="0.5" value="0" />
        <span class="val" id="eqMidV">0.0 dB</span>
        <span class="hz">mid 900</span>
      </div>
      <div class="band">
        <input id="eqHigh" type="range" min="-18" max="18" step="0.5" value="0" />
        <span class="val" id="eqHighV">0.0 dB</span>
        <span class="hz">high 5k</span>
      </div>
    </div>
  </div>
-->

<script type="module" src="/web/panel.js"></script>
</body>
</html>
